name: Build Debug APK

# Her push'ta ve PR'da debug APK derler, artifact olarak yükler. Release imzası gerekmez;
# debug anahtarı kullanılır. Fork'ta çalışması için Actions'ı etkinleştirmen gerekir (Actions sekmesi).

on:
  push:
    branches-ignore:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: assembleDebug + unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: local.properties (SDK dizini)
        run: echo "sdk.dir=$ANDROID_SDK_ROOT" > local.properties

      - name: gradlew çalıştırılabilir yap
        run: chmod +x gradlew

      - name: Derle ve testleri çalıştır
        run: ./gradlew :app:assembleDebug :app:testDebugUnitTest --stacktrace

      - name: Debug APK'yı yükle
        uses: actions/upload-artifact@v4
        with:
          name: mapcontrol-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Test raporunu yükle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-report
          path: app/build/reports/tests/testDebugUnitTest
          if-no-files-found: ignore
